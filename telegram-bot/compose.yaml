services:
  bot:
    build: .
    env_file: .env
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    volumes:
      - bot-data:/data
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
volumes:
  bot-data:
